environment:
  max_steps: 2048
  k_doses: 3
  device: cuda
  dtype: float32
  rewards:
    population:
      target_population: 500
      population_norm: 1000.0
      population_norm_reward: 500.0
      w_population_maintenance: 0.01
      count_population_reward: 0.0
      count_population_reward_alpha: 1.0
      count_population_reward_beta: 0.5
      noop_band_factor: 0.02
      noop_reward_magnitude: 0.01
      kernel_type: gaussian
      kernel_peak_reward: 1.0
      kernel_max_penalty: 0.0
      kernel_zero_distance: 100.0
    dose:
      w_pop: 1.0
      w_genome: 0.5
      w_cost: 0.05
      missing_feedback_penalty: 0.5
    budget:
      budget_init: 100.0
      budget_norm: 100.0
      budget_penalty: 10.0
      unaffordable_action_penalty: 0.0
    survival_bonus:
      enabled: true
      base_bonus: 0.1
      scaling_type: linear
      scaling_factor: 0.001
      max_bonus: 2.0
    budget_conservation:
      enabled: true
      weight: 0.01
      spending_penalty_factor: 1.0
      reserve_bonus_threshold: 0.5
      reserve_bonus_magnitude: 0.005
    informed_dosing:
      reward_window_steps: 5
      reward_weight: 1.0
      max_reward_per_dose: 5.0
      time_decay: true
      decay_type: linear
      decay_rate: 0.2
      min_reward_fraction: 0.0
    regular_monitoring:
      count_reward: 0.0
      count_interval: 15
      count_min_interval: 3
      safe_nondosing_reward: 0.0
    critical_inaction:
      high_population_threshold: 3.0
      no_action_penalty: 0.0
      no_dose_penalty: 0.0
      freshness_window: 5
      noop_penalty: 0.0
      noop_threshold: 15
    sequencing:
      redundant_penalty: 0.001
actions:
  noop:
    cost: 0.0
  count_bacteria:
    cost: 0.5
  sequencing:
    cost: 2.5
    duration: 5
  dose:
    cost_per_unit: 2.0
model:
  hidden_dim: 512
  rnn_layers: 2
  n_discrete: 4
  dose_action_index: 3
  k_doses: 3
ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  ent_coef: 0.015
  max_grad_norm: 0.5
  rollout_steps: 2048
  epochs: 15
  seq_len: 128
  batch_seq_len: 128
  lr: 0.0001
training:
  total_updates: 200
  seed: 42
  checkpoint_interval: 25
  log_interval: 2
  save_dir: ./checkpoints
  experiment_name: descouraged_seq
  save_checkpoints_per_run: false
