# Simple reward system configuration following pseudo-code structure
# All rewards are pre/post step based with timing windows and freshness checks

environment:
  max_steps: 2048
  k_doses: 3
  device: "cuda"
  dtype: "float32"

  # Timing and freshness thresholds
  timing:
    t_count_freshness: 5              # Steps for count to remain "fresh"
    t_seq_freshness: 8                # Steps for sequencing to remain "fresh"
    max_count_window: 20              # Max steps without counting before penalty
    critical_ratio: 3.0               # Population ratio for critical state (target × ratio)
    
    # Timing windows for informative actions
    count_window:
      min_elapsed: 3                  # Minimum time between counts
      max_elapsed: 15                 # Maximum time for informative count
    
    seq_window:
      min_elapsed: 25                  # Minimum time between sequencing
      max_elapsed: 50                 # Maximum time for informative sequencing

  # Reward/Penalty scalars (all configurable)
  rewards:
    # Pre-step rewards (informed dosing)
    informed_dosing:
      penalty_dosing_under_target: 5.0        # Penalty for dosing when pop < target
      reward_dosing_above_with_seq: 1.5       # Reward for dosing above target with seq
      reward_dosing_above_no_seq: 1.0         # Reward for dosing above target without seq
      penalty_blind_dose: 3.0                 # Penalty for dosing without fresh count
    
    # Pre-step rewards (sequencing)
    sequencing:
      seq_already_pending_penalty: 0.1        # Penalty for redundant sequencing
      informative_seq_reward: 3.0             # Reward for informative sequencing
    
    # Pre-step rewards (counting)
    counting:
      informative_count_reward: 2.0           # Reward for informative counting
    
    # Pre-step rewards (strategic NOOP)
    noop:
      strategic_noop_reward: 0.5              # Reward for waiting when below target
    
    # Post-step penalties
    critical_penalties:
      penalty_critical_no_dose: 5.0           # Penalty for not dosing when critical
      penalty_critical_no_count: 2.0          # Penalty for stale count data
    
    
    # Population maintenance (kernel-based)
    population_maintenance:
      enabled: true
      target_population: 100
      kernel_type: "gaussian"                 # "gaussian" or "laplace"
      kernel_peak_reward: 20.0                 # R: peak reward at target
      kernel_max_penalty: 1.0                 # M: maximum penalty (min value -M)
      kernel_zero_distance: 50.0              # distance where kernel equals 0
    
    # Survival bonus (per-step reward for staying alive)
    survival_bonus:
      enabled: true
      base_bonus: 0.1
      scaling_type: "linear"                  # "constant", "linear", "exponential"
      scaling_factor: 0.001
      max_bonus: 2.0
    
    # Prediction accuracy reward (COUNT-only)
    prediction:
      enabled: true
      weight: 0.2
    
    # Early termination on unrecoverable states
    early_termination:
      enabled: true
      penalty: 25.0                           # Penalty applied on early termination
      min_penalty: 10.0                       # Penalty when terminating near horizon
      penalty_decay_power: 1.0                # Decay rate exponent
      population_low_threshold: 0.2           # Terminate if pop < target × this
      population_threshold: 3               # Unrecoverable if pop > target × this
      extinction_penalty: 50.0                # Additional penalty for extinction
      require_budget_depleted: false          # If true, also require budget == 0

  # Other environment parameters
  budget:
    budget_init: 100.0
    budget_norm: 100.0
  
  population:
    target_population: 100
    population_norm: 300.0                    # For observation normalization only

# Action costs and durations
actions:
  noop:
    id: 0
    cost: 0.0
    duration: 0

  count_bacteria:
    id: 1
    cost: 0.5
    duration: 0

  sequencing:
    id: 2
    cost: 2.5
    duration: 5

  dose:
    id: 3
    cost: 2.0
    cost_per_unit: 2.0
    duration: 0

# Model architecture
model:
  hidden_dim: 512
  rnn_layers: 2
  n_discrete: 4
  dose_action_index: 3
  k_doses: 3

# PPO hyperparameters
ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  ent_coef: 0.015
  max_grad_norm: 0.5
  rollout_steps: 2048
  epochs: 15
  seq_len: 128
  batch_seq_len: 128
  lr: 0.0001

# Training configuration
training:
  total_updates: 200
  seed: 42
  checkpoint_interval: 25
  log_interval: 2
  save_dir: "./checkpoints"
  experiment_name: "descouraged_seq"
  save_checkpoints_per_run: false
