environment:
  max_steps: 512
  k_doses: 3
  device: "cuda"
  dtype: "float32"

  rewards:
    population:
      target_population: 100
      population_norm: 500.0
      w_population_maintenance: 0.0
      count_population_reward: 1.0
      noop_band_factor: 0.1
      noop_reward_magnitude: 0.0

    dose:
      w_pop: 0.0
      w_genome: 0.0
      w_cost: 0.1
      missing_feedback_penalty: 0.0

    sequencing:
      redundant_penalty: 0.001

    informed_dosing:
      reward: 2.0
      above_target_reward: 4.0
      window: 5
      sequencing_window: 5
      blind_penalty: 2.0
      low_population_penalty: 1.0

    critical_inaction:
      high_population_threshold: 5.0
      no_action_penalty: 0
      no_dose_penalty: 0
      freshness_window: 5
      noop_penalty: 0.1
      noop_threshold: 30

    regular_monitoring:
      count_reward: 5.0
      count_interval: 30
      count_min_interval: 3
      safe_nondosing_reward: 0.0

    budget:
      budget_init: 100.0
      budget_norm: 100.0
      budget_penalty: 5.0

    survival_bonus:
      enabled: true
      base_bonus: 0.1
      scaling_type: "linear"
      scaling_factor: 0.001
      max_bonus: 2

    prediction:
      enabled: true
      weight: 1.0

        # Early termination on unrecoverable NOOP-only states
    early_termination:
      enabled: true                    # Enable early termination when only NOOP is available in unrecoverable state
      penalty: 5.0                     # Penalty applied on early termination
      population_threshold: 1.5         # Population must exceed (target × this factor) to be unrecoverable
      require_budget_depleted: false     # If true, also require budget depleted to trigger


actions:
  noop:
    id: 0
    cost: 0.0

  count_bacteria:
    id: 1
    cost: 0.5
    duration: 0

  sequencing:
    id: 2
    cost: 5.0
    duration: 5

  dose:
    id: 3
    cost: 2.0
    cost_per_unit: 3.0
    duration: 0

model:
  hidden_dim: 512
  rnn_layers: 2
  n_discrete: 4
  dose_action_index: 3
  k_doses: 3

ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  ent_coef: 0.015
  max_grad_norm: 0.5
  rollout_steps: 2048
  epochs: 6
  seq_len: 128
  batch_seq_len: 128
  lr: 0.0001

training:
  total_updates: 2500
  seed: 42
  checkpoint_interval: 30
  log_interval: 2
  save_dir: "./checkpoints"
  experiment_name: "ppo_production_clean"
  save_checkpoints_per_run: false
