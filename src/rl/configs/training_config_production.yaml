# Production Training Configuration
# For full training runs - higher precision, longer training
# Run with: python -m rl.train --config rl/configs/training_config_production.yaml

environment:
  max_steps: 512
  k_doses: 3
  device: "cuda"
  dtype: "float32"
  
  # Reward configuration (organized by category)
  rewards:
    # Population-based rewards
    population:
      target_population: 100
      population_norm: 500.0
      w_population_maintenance: 0.0    # DISABLED: No continuous maintenance reward
      count_population_reward: 10.0    # NEW: Immediate reward after COUNT based on distance to target
      noop_band_factor: 0.1            # Deadband around target for NOOP
      noop_reward_magnitude: 0.0       # INCREASED: NOOP shaping magnitude
    
    # Dose efficacy rewards (DISABLED - let model learn relationship)
    dose:
      w_pop: 0.0                        # DISABLED: No immediate population feedback on DOSE
      w_genome: 0.0                     # DISABLED: No resistance term
      w_cost: 1.0                     # Small cost penalty to discourage spam
      missing_feedback_penalty: 0.5     # Penalty when dose efficacy can't be evaluated

    # Sequencing behavior
    sequencing:
      redundant_penalty: 0.001          # Penalty for launching sequencing while one is pending
    
    # Informed dosing (NEW: encourage count + sequencing before dose)
    informed_dosing:
      reward: 1.                       # Bonus for dosing after recent count AND sequencing
      above_target_reward: 10.0          # Additional bonus for informed dosing when population above target
      window: 5                         # Steps to consider count "recent"
      sequencing_window: 5             # Steps to consider sequencing "recent"
      blind_penalty: 30.0              # Penalty for dosing without recent count OR sequencing
      low_population_penalty: 20.0     # HUGE penalty for dosing when population below target
    
    # Critical action penalties (NEW: penalize inaction when population is dangerously high)
    critical_inaction:
      high_population_threshold: 3.0    # Multiplier of target (3x = critical)
      no_action_penalty: 0.0           # Penalty for not seq/dosing when count shows 3x target
      no_dose_penalty: 100.0            # Penalty for not dosing when count+seq fresh and 3x target
      freshness_window: 5               # Steps to consider data "fresh"
    
    # Regular monitoring rewards (encourage proactive information gathering)
    regular_monitoring:
      count_reward: 0.0                 # Reward for counting at regular intervals
      count_interval: 30                # Maximum interval (upper bound of optimal window)
      count_min_interval: 3             # Minimum interval (lower bound - avoid spam)
      safe_nondosing_reward: 0.0        # REDUCED: Small per-step reward for NOT dosing when pop low
    
    # Budget management
    budget:
      budget_init: 100.0
      budget_norm: 100.0
      budget_penalty: 50.0               # INCREASED: Penalty when budget reaches 0
      unaffordable_action_penalty: 100.0  # NEW: Penalty for attempting unaffordable action (converted to NOOP)
    
    # Survival bonus reward (encourages longer episodes)
    survival_bonus:
      enabled: true
      base_bonus: 0.2                   # Small base reward per step
      scaling_type: "linear"            # "constant", "linear", or "exponential"
      scaling_factor: 0.01              # Gradual linear increase: +0.01 reward per step
      max_bonus: 1                   # Cap at 10 reward/step (reached at ~950 steps)
    
    # Budget conservation reward (DISABLED)
    budget_conservation:
      enabled: false
      weight: 0.01                      # Overall weight
      spending_penalty_factor: 1.0      # Penalty multiplier for spending rate
      reserve_bonus_threshold: 0.5      # Budget fraction for reserve bonus (50%)
      reserve_bonus_magnitude: 0.005    # Bonus when above threshold
    
    # Prediction accuracy reward (encourages accurate population prediction on COUNT)
    prediction:
      enabled: true
      weight: 5.0                       # Weight for prediction accuracy reward (applied only on COUNT)

actions:
  noop:
    id: 0
    name: "No operation"
    cost: 0.0
    duration: 0
    description: "Wait without taking action"
  
  count_bacteria:
    id: 1
    name: "Count bacteria"
    cost: 0.5                           # REDUCED: Make counting affordable
    duration: 0
    description: "Measure current bacteria population"
  
  sequencing:
    id: 2
    name: "Genome sequencing"
    cost: 5.0
    duration: 5
    description: "Sequence bacteria genome"
  
  dose:
    id: 3
    name: "Administer antibiotics"
    cost: 2.0                           # Fixed cost per dose action (regardless of quantity)
    cost_per_unit: 10.0                  # Variable cost per unit of antibiotic
    duration: 0
    description: "Dose antibiotics"

model:
  hidden_dim: 512
  rnn_layers: 2
  n_discrete: 4
  dose_action_index: 3
  k_doses: 3

ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.1
  vf_coef: 0.5
  ent_coef: 0.005
  max_grad_norm: 0.5
  rollout_steps: 512
  epochs: 16
  seq_len: 128
  batch_seq_len: 128
  lr: 0.0001

training:
  total_updates: 1000
  seed: 42
  checkpoint_interval: 30
  log_interval: 2
  save_dir: "./checkpoints"
  experiment_name: "ppo_production"
  save_checkpoints_per_run: false  # Set to true to save checkpoints in timestamped run directories
