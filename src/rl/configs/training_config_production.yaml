# Production Training Configuration
# For full training runs - higher precision, longer training
# Run with: python -m rl.train --config rl/configs/training_config_production.yaml

environment:
  max_steps: 512
  k_doses: 3
  device: "cuda"
  dtype: "float32"
  
  # Reward configuration (organized by category)
  rewards:
    # Population-based rewards
    population:
      target_population: 500
      population_norm: 200.0
      w_population_maintenance: 1.0    # MAIN REWARD: Only given on COUNT
      noop_band_factor: 0.02            # Deadband around target for NOOP
      noop_reward_magnitude: 0.0       # NOOP shaping magnitude
    
    # Dose efficacy rewards (DISABLED - let model learn relationship)
    dose:
      w_pop: 0.0                        # DISABLED: No immediate population feedback on DOSE
      w_genome: 0.0                     # DISABLED: No resistance term
      w_cost: 0.1                       # Cost penalty only
    
    # Budget management
    budget:
      budget_init: 100.0
      budget_norm: 100.0
      budget_penalty: 0.0               # DISABLED: Set to 0
    
    # Survival bonus reward (encourages longer episodes)
    survival_bonus:
      enabled: true
      base_bonus: 0.01                  # Base bonus per step
      scaling_type: "constant"          # "constant", "linear", or "exponential"
      scaling_factor: 0.1               # Multiplier for linear/exponential scaling
      max_bonus: 0.1                    # Maximum bonus cap
    
    # Budget conservation reward (DISABLED)
    budget_conservation:
      enabled: false
      weight: 0.01                      # Overall weight
      spending_penalty_factor: 1.0      # Penalty multiplier for spending rate
      reserve_bonus_threshold: 0.5      # Budget fraction for reserve bonus (50%)
      reserve_bonus_magnitude: 0.005    # Bonus when above threshold

actions:
  noop:
    id: 0
    name: "No operation"
    cost: 0.0
    duration: 0
    description: "Wait without taking action"
  
  count_bacteria:
    id: 1
    name: "Count bacteria"
    cost: 2.0
    duration: 0
    description: "Measure current bacteria population"
  
  sequencing:
    id: 2
    name: "Genome sequencing"
    cost: 5.0
    duration: 5
    description: "Sequence bacteria genome"
  
  dose:
    id: 3
    name: "Administer antibiotics"
    cost_per_unit: 1
    duration: 0
    description: "Dose antibiotics"

model:
  hidden_dim: 256
  rnn_layers: 3
  n_discrete: 4
  dose_action_index: 3
  k_doses: 3

ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.1
  vf_coef: 0.5
  ent_coef: 0.005
  max_grad_norm: 0.5
  rollout_steps: 512
  epochs: 16
  seq_len: 128
  batch_seq_len: 128
  lr: 0.0001

training:
  total_updates: 200
  seed: 42
  checkpoint_interval: 30
  log_interval: 2
  save_dir: "./checkpoints"
  experiment_name: "ppo_production"
