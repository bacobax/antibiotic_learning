# Action Configuration for Bacteria Simulation RL Agent
# Defines available actions and their costs/durations

actions:
  noop:
    id: 0
    name: "No operation"
    cost: 0.00
    duration: 0
    description: "Wait without taking action"
  
  count_bacteria:
    id: 1
    name: "Count bacteria"
    cost: 0.0
    duration: 0
    description: "Measure current bacteria population (instant, no cost)"
  
  sequencing:
    id: 2
    name: "Genome sequencing"
    cost: 1.0
    duration: 5
    description: "Sequence bacteria genome to detect resistance (takes 5 steps)"
  
  dose:
    id: 3
    name: "Administer antibiotics"
    cost_per_unit: 0.5
    duration: 0
    description: "Dose antibiotics (continuous action, 0-1 for each antibiotic)"

# Environment parameters
environment:
  max_steps: 1000
  k_doses: 3
  device: "cpu"
  dtype: "float32"
  
  # Reward configuration (organized by category)
  rewards:
    # Population-based rewards
    population:
      target_population: 100
      population_norm: 1000.0
      w_population_maintenance: 0.01    # Weight for maintenance penalty
      noop_band_factor: 0.02            # Deadband around target for NOOP
      noop_reward_magnitude: 0.01       # NOOP shaping magnitude
    
    # Dose efficacy rewards
    dose:
      w_pop: 0.5                        # Weight for population control term
      w_genome: 0.05                    # Weight for resistance reduction term
      w_cost: 0.05                      # Weight for cost penalty
    
    # Budget management
    budget:
      budget_init: 100.0
      budget_norm: 100.0
      budget_penalty: 10.0              # Penalty when budget reaches 0
    
    # Survival bonus reward (encourages longer episodes)
    survival_bonus:
      enabled: true
      base_bonus: 0.01                  # Base bonus per step
      scaling_type: "constant"          # "constant", "linear", or "exponential"
      scaling_factor: 0.1               # Multiplier for linear/exponential scaling
      max_bonus: 0.1                    # Maximum bonus cap
    
    # Budget conservation reward (encourages efficient spending)
    budget_conservation:
      enabled: true
      weight: 0.01                      # Overall weight for budget conservation
      spending_penalty_factor: 1.0      # Penalty multiplier for spending rate
      reserve_bonus_threshold: 0.5      # Budget fraction for reserve bonus (50%)
      reserve_bonus_magnitude: 0.005    # Bonus when above threshold

